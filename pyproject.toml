[project]
name = "contact-enrichment-skill"
version = "0.1.0"
description = "Small-scale contact enrichment skill"
readme = ".agent/prd.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128.8",
  "httpx>=0.27.0",
  "instaloader>=4.15",
  "pydantic>=2.10.0",
  "scrapetube>=2.6.0",
  "uvicorn>=0.40.0",
  "yt-search-python>=2.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
python_files = ["test_*.unit.py", "test_*.int.py"]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
